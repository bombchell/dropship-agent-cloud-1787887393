<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; background: #0f172a; color: #f8fafc; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; }
        .price { color: #4ade80; font-weight: bold; font-size: 1.25rem; }
    </style>
</head>
<body>
    <h1>Featured Products</h1>
    <div id="catalog" class="grid">Loading catalog from cloud...</div>
    <script>
        fetch("products.json")
            .then(r => r.json())
            .then(data => {
                const el = document.getElementById("catalog");
                el.innerHTML = data.map(p => `<div class="card"><h3>${p.title}</h3><p>${p.description}</p><p class="price">$${p.price}</p></div>`).join("");
            }).catch(() => { document.getElementById("catalog").innerHTML = "<p>Catalog updating...</p>"; });
    </script>
</body>
</html>
