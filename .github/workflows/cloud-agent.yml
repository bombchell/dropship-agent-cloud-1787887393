name: Cloud Dropshipping Agent
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch AI Product & Generate Copy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json, os, re, requests

          prompt = \"Return ONLY a raw JSON array containing 1 dropshipping product object with keys: title, price, description, supplier_url. Do not use markdown syntax, code fences, or intro text.\"

          headers = {\"Authorization\": \"Bearer \" + os.environ[\"GITHUB_TOKEN\"], \"Content-Type\": \"application/json\"}
          payload = {\"messages\": [{\"role\": \"user\", \"content\": prompt}], \"model\": \"gpt-4o\"}

          fallback = [{\"title\": \"Minimalist Desk Lamp\", \"price\": 29.99, \"description\": \"Sleek LED desk lighting with touch controls.\", \"supplier_url\": \"https://example.com\"}]

          try:
              res = requests.post(\"https://models.inference.ai.azure.com/chat/completions\", headers=headers, json=payload, timeout=15)
              raw = res.json()[\"choices\"][0][\"message\"][\"content\"].strip()
              clean = re.sub(r\"^```json\s*|```$\", \"\", raw, flags=re.MULTILINE).strip()
              data = json.loads(clean)
              if not isinstance(data, list): data = [data]
          except Exception as e:
              data = fallback

          with open(\"products.json\", \"w\") as f:
              json.dump(data, f, indent=2)
          "
      - name: Commit Updated Catalog
        run: |
          git config --global user.name "Cloud-Agent-Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add products.json
          git diff --quiet || (git commit -m "Cloud AI catalog update [skip ci]" && git push)

