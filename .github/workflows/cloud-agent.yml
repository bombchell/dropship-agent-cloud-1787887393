name: Cloud Dropshipping Agent
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch AI Product & Generate Copy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json, os, requests

          prompt = \"Generate a single viral dropshipping product entry in JSON format with title, price, description, and supplier_url.\"

          headers = {\"Authorization\": \"Bearer \" + os.environ[\"GITHUB_TOKEN\"], \"Content-Type\": \"application/json\"}
          payload = {\"messages\": [{\"role\": \"user\", \"content\": prompt}], \"model\": \"gpt-4o\"}

          try:
              res = requests.post(\"https://models.inference.ai.azure.com/chat/completions\", headers=headers, json=payload, timeout=15)
              content = res.json()[\"choices\"][0][\"message\"][\"content\"]
          except Exception as e:
              content = json.dumps([{\"id\": \"fallback-1\", \"title\": \"Minimalist Desk Lamp\", \"price\": 29.99, \"description\": \"Sleek LED desk lighting.\"}])

          with open(\"products.json\", \"w\") as f:
              f.write(content)
          "
      - name: Commit Updated Catalog
        run: |
          git config --global user.name "Cloud-Agent-Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add products.json
          git diff --quiet || (git commit -m "Cloud AI catalog update [skip ci]" && git push)
