name: Cloud Dropshipping Agent
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch AI High-Margin Product
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json, os, re, requests

          prompt = \"Return ONLY a raw JSON array with 3 high-margin viral dropshipping products. Keys required: title, price, description, image_url, checkout_url. Do not include markdown fences.\"

          headers = {\"Authorization\": \"Bearer \" + os.environ[\"GITHUB_TOKEN\"], \"Content-Type\": \"application/json\"}
          payload = {\"messages\": [{\"role\": \"user\", \"content\": prompt}], \"model\": \"gpt-4o\"}

          fallback = [
            {
              \"title\": \"Minimalist Smart Ambient Lamp\",
              \"price\": \"39.99\",
              \"description\": \"RGB desktop lighting with mobile app synchronization and sound reactivity.\",
              \"image_url\": \"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=600\",
              \"checkout_url\": \"https://stripe.com\"
            }
          ]

          try:
              res = requests.post(\"https://models.inference.ai.azure.com/chat/completions\", headers=headers, json=payload, timeout=15)
              raw = res.json()[\"choices\"][0][\"message\"][\"content\"].strip()
              clean = re.sub(r\"^```json\s*|```$\", \"\", raw, flags=re.MULTILINE).strip()
              data = json.loads(clean)
              if not isinstance(data, list): data = [data]
          except Exception:
              data = fallback

          with open(\"products.json\", \"w\") as f:
              json.dump(data, f, indent=2)
          "
      - name: Commit Updated Catalog
        run: |
          git config --global user.name "Cloud-Agent-Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add products.json
          git diff --quiet || (git commit -m "Update high-margin catalog [skip ci]" && git push)

